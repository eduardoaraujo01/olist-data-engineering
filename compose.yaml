name: olist-local

services:
  minio:
    image: olist-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion:
    image: olist-python-jobs:local
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-olist-data-lake}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./data/source:/workspace/data/source:ro
    command: ["python", "ingestion/ingest_raw.py"]

  processing:
    image: olist-python-jobs:local
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-olist-data-lake}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD in .env}
    command: ["python", "processing/build_processed.py"]

  curated:
    image: olist-python-jobs:local
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-olist-data-lake}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD in .env}
    command: ["python", "processing/build_curated.py"]

  warehouse_load:
    image: olist-python-jobs:local
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-olist-data-lake}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configure MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-olist_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    command: ["python", "warehouse/load_postgres.py"]

  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/curated/01_create_orders_model.sql:/docker-entrypoint-initdb.d/01_create_orders_model.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$${POSTGRES_USER}\" -d \"$$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  metabase:
    image: metabase/metabase:v0.63.18.x
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Sao_Paulo
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  minio_data:
  postgres_data:
  metabase_data:

